<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Order of the Day | Raphael &amp; Aisling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<main class="page">

  <header class="intro">
    <a class="back-link" href="index.html">&larr; Back</a>
    <p class="eyebrow">05 September 2026</p>

  <hr class="rule">

  <section class="schedule" aria-label="Wedding day schedule">
    <ul class="schedule-list">

      <li class="schedule-item">
        <span class="schedule-time">1:30 PM</span>

      </li>
      <li class="schedule-item">
        <span class="schedule-time">3:00 PM</span>
        <span class="schedule-event">Bus to Crazy Coqs</span>

      <li class="schedule-item">
        <span class="schedule-time">4:00 PM</span>
        <span class="schedule-event">Wedding Breakfast</span>
      </li>
      <li class="schedule-item">
        <span class="schedule-time">6:30 PM</span>
        <span class="schedule-event">Speeches</span>
      </li>

        <span class="schedule-time">7:45 PM</span>

  <footer class="closing">
    <p class="thank-you">Thank you for being here</p>
    <p class="signature">R &amp; A &middot; 05.09.26</p>
  </footer>

</main>
